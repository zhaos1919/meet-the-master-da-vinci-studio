<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17130f;color:#eee5d6;font-family:"Songti SC",serif}.wrap{height:100%;padding:44px 44px 34px;display:flex;flex-direction:column}.top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px}.kicker{font:10px Arial;letter-spacing:.38em;color:#c8a777;margin-bottom:8px}.title{font-size:30px;letter-spacing:.12em;font-weight:500}.mark{font:italic 42px Georgia;color:#c5a46e;border:1px solid #7b6546;width:62px;height:62px;display:grid;place-items:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;min-height:0;flex:1}.card{position:relative;overflow:hidden;border:1px solid #594a37;background:#0b0908}.card img{width:100%;height:100%;object-fit:cover}.label{position:absolute;left:0;right:0;bottom:0;padding:33px 22px 18px;background:linear-gradient(transparent,rgba(8,6,4,.86));font-size:18px;letter-spacing:.28em}.label small{display:block;font:8px Arial;letter-spacing:.3em;color:#c7aa78;margin-bottom:6px}.footer{font:8px Arial;letter-spacing:.24em;color:#7f715f;text-align:right;margin-top:16px}</style></head><body><div class="wrap"><div class="top"><div><div class="kicker">MEET THE MASTER · LIGHT STUDY</div><div class="title">《遇见画家｜光影中的达芬奇画室》</div></div><div class="mark">L</div></div><div class="grid"><div class="card"><img src="/renders/day.png"><div class="label"><small>DAYLIGHT</small>白天</div></div><div class="card"><img src="/renders/sunset.png"><div class="label"><small>GOLDEN HOUR</small>黄昏</div></div><div class="card"><img src="/renders/night.png"><div class="label"><small>CANDLELIGHT</small>夜晚</div></div></div><div class="footer">REAL-TIME THREE.JS RENDER · 2026</div></div></body></html>
